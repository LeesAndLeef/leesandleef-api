name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
          yarn install --immutable

      - name: Biome
        run: yarn check

      - name: Typecheck
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leesandleef
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/leesandleef
      JWT_SECRET: ci-jwt-secret-that-is-at-least-32-characters
      COOKIE_SECRET: ci-cookie-secret-that-is-at-least-32-chars
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
          yarn install --immutable

      - name: Migrations match the schema
        run: |
          yarn db:generate --name=ci_drift_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts has changes without a migration. Run yarn db:generate and commit it."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Migrate
        run: yarn db:migrate

      - name: Seed
        run: yarn db:seed

      - name: Test
        run: yarn test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
          yarn install --immutable

      - name: Build
        run: yarn build
